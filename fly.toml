# fly.toml - Configuration Fly.io pour EcoRide
# Remplace "ecoride" par le nom choisi lors de "fly launch"

app = "ecoride"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Volume persistant pour les photos de profil uploadées
[[mounts]]
  source = "ecoride_uploads"
  destination = "/var/www/html/images/profil"
